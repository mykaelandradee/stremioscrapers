name: Build frontend

on:
  push:
    branches: [main]
    paths:
      - "front_vite/**"
      - ".github/workflows/build-frontend.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front_vite
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: front_vite/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Commit generated frontend
        working-directory: .
        run: |
          if git diff --quiet -- static; then
            echo "Frontend build produced no changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static
          git commit -m "build: regenerate Stremio Scrapers frontend"
          git push
